<header class="kopf">
  <a routerLink="/" class="marke">Anwendungsrahmen</a>
</header>

<div class="rumpf">
  <nav class="navigation" aria-label="Hauptnavigation">
    <a
      routerLink="/"
      routerLinkActive="aktiv"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Startseite
    </a>
    @for (eintrag of navigation; track eintrag.path) {
      <a
        [routerLink]="eintrag.path"
        routerLinkActive="aktiv"
        [class.hat-kinder]="eintrag.kinder?.length"
      >
        {{ eintrag.label }}
      </a>
      <!-- Untermenü nur im aktiven Bereich aufgeklappt -->
      @if (aufgeklappt().has(eintrag.path)) {
        <div class="untermenue" role="group" [attr.aria-label]="eintrag.label">
          @for (kind of eintrag.kinder; track kind.path) {
            <a
              [routerLink]="kind.path"
              routerLinkActive="aktiv"
              ariaCurrentWhenActive="page"
            >
              {{ kind.label }}
            </a>
          }
        </div>
      }
    }
  </nav>

  <main class="inhalt">
    <router-outlet />
  </main>
</div>
